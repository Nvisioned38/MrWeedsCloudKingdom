name: Cloud Kingdom Android V1 preview

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-kingdom-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify Flutter and build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify owner-approved Issue #4 Match-3 sprites
        run: python3 tools/verify_issue4_art.py

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.47.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Normalize formatting for preview build
        run: |
          dart format lib test
          if ! git diff --quiet -- lib test; then
            echo 'Formatting changes were required; preview proceeds with normalized source. Commit formatting before release.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Static analysis
        run: flutter analyze

      - name: Flutter tests
        run: flutter test

      - name: Report source art state
        shell: bash
        run: |
          if [ -d assets/art ]; then
            count=$(find assets/art -type f \( -iname '*.png' -o -iname '*.webp' \) | wc -l)
            echo "Runtime art files detected: $count" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ART INTAKE INCOMPLETE: no assets/art directory. APK is a technical preview only." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "This job does not assert owner visual approval or Samsung S24 Ultra manual test." >> "$GITHUB_STEP_SUMMARY"

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Record APK checksum and commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/release-evidence
          sha256sum build/app/outputs/flutter-apk/app-debug.apk | tee build/release-evidence/sha256.txt
          echo "Commit: $GITHUB_SHA" | tee build/release-evidence/commit.txt
          echo '### APK artifact' >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: `$GITHUB_SHA`" >> "$GITHUB_STEP_SUMMARY"
          echo 'Debug APK generated; manual device testing remains separate.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: cloud-kingdom-android-debug-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/release-evidence/sha256.txt
            build/release-evidence/commit.txt
          if-no-files-found: error
          retention-days: 30
